name: Azure Secret Expiry Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: azure-secret-expiry-monitor
  cancel-in-progress: false

env:
  THRESHOLD_DAYS: ${{ vars.THRESHOLD_DAYS || 30 }}
  UPCOMING_DAYS: ${{ vars.UPCOMING_DAYS || 60 }}

jobs:

  scan:
    name: Scan Entra application credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Scan all applications and credentials
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          export GRAPH_TOKEN="$(az account get-access-token \
            --resource-type ms-graph \
            --query accessToken \
            -o tsv)"

          : "${GRAPH_TOKEN:?Could not obtain Microsoft Graph token}"

          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["GRAPH_TOKEN"]

          threshold = int(
              os.environ.get("THRESHOLD_DAYS", "30")
          )

          upcoming_days = int(
              os.environ.get("UPCOMING_DAYS", "60")
          )

          summary_file = os.environ["GITHUB_STEP_SUMMARY"]

          now = datetime.now(timezone.utc)

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:
                  return json.load(response)

          applications = []

          url = (
              "https://graph.microsoft.com/v1.0/applications"
              "?$select=id,appId,displayName,passwordCredentials,keyCredentials"
              "&$top=999"
          )

          while url:
              response = get_json(url)

              applications.extend(
                  response.get("value", [])
              )

              url = response.get("@odata.nextLink")

          credentials = []

          for app in applications:

              application = (
                  app.get("displayName")
                  or "(no display name)"
              )

              app_id = app.get("appId") or ""

              # Client secrets
              for credential in app.get(
                  "passwordCredentials",
                  []
              ):

                  if credential.get("endDateTime"):

                      credentials.append(
                          {
                              "application": application,
                              "appId": app_id,
                              "type": "Client secret",
                              "credentialName":
                                  credential.get(
                                      "displayName"
                                  )
                                  or "(unnamed secret)",
                              "keyId":
                                  credential.get(
                                      "keyId"
                                  )
                                  or "",
                              "endDateTime":
                                  credential[
                                      "endDateTime"
                                  ],
                          }
                      )

              # Certificates
              for credential in app.get(
                  "keyCredentials",
                  []
              ):

                  if credential.get("endDateTime"):

                      credentials.append(
                          {
                              "application": application,
                              "appId": app_id,
                              "type": "Certificate",
                              "credentialName":
                                  credential.get(
                                      "displayName"
                                  )
                                  or credential.get(
                                      "keyId"
                                  )
                                  or "(unnamed certificate)",
                              "keyId":
                                  credential.get(
                                      "keyId"
                                  )
                                  or "",
                              "endDateTime":
                                  credential[
                                      "endDateTime"
                                  ],
                          }
                      )

          # Calculate status and remaining days
          for credential in credentials:

              expiry = datetime.fromisoformat(
                  credential["endDateTime"]
                  .replace("Z", "+00:00")
              )

              remaining_seconds = (
                  expiry - now
              ).total_seconds()

              remaining_days = (
                  remaining_seconds / 86400
              )

              if remaining_seconds <= 0:

                  status = "EXPIRED"

              elif remaining_days <= threshold:

                  status = "EXPIRING_SOON"

              elif remaining_days <= upcoming_days:

                  status = "UPCOMING"

              else:

                  status = "HEALTHY"

              credential["expiry"] = (
                  expiry.strftime(
                      "%Y-%m-%d %H:%M UTC"
                  )
              )

              # Whole number only
              credential["days"] = max(
                  0,
                  int(remaining_days)
              )

              credential["status"] = status

          credentials.sort(
              key=lambda item: item["days"]
          )

          counts = {
              status:
                  sum(
                      c["status"] == status
                      for c in credentials
                  )
              for status in (
                  "HEALTHY",
                  "UPCOMING",
                  "EXPIRING_SOON",
                  "EXPIRED",
              )
          }

          attention = [
              c
              for c in credentials
              if c["status"]
              in (
                  "EXPIRING_SOON",
                  "EXPIRED",
              )
          ]

          upcoming = [
              c
              for c in credentials
              if c["status"] == "UPCOMING"
          ]

          # Save scan results for the next job
          with open(
              "scan-results.json",
              "w"
          ) as file:

              json.dump(
                  {
                      "credentials": credentials,
                      "alerts": attention,
                  },
                  file,
                  indent=2
              )

          def table_row(c):

              return (
                  f"| {c['application']} "
                  f"| `{c['appId']}` "
                  f"| {c['type']} "
                  f"| {c['credentialName']} "
                  f"| {c['expiry']} "
                  f"| {c['days']} days "
                  f"| **{c['status']}** "
                  f"| `{c['keyId']}` |"
              )

          # Generate detailed report
          with open(
              "report.md",
              "w"
          ) as summary:

              summary.write(
                  "# Azure Secret Expiry Report\n\n"
              )

              summary.write(
                  f"Checked: "
                  f"{now.strftime('%Y-%m-%d %H:%M UTC')}"
                  "\n\n"
              )

              summary.write(
                  "## Overview\n\n"
              )

              summary.write(
                  "| Metric | Count |\n"
                  "|---|---:|\n"
              )

              summary.write(
                  f"| Applications scanned "
                  f"| {len(applications)} |\n"
              )

              summary.write(
                  f"| Credentials scanned "
                  f"| {len(credentials)} |\n"
              )

              summary.write(
                  f"| Healthy "
                  f"| {counts['HEALTHY']} |\n"
              )

              summary.write(
                  f"| Upcoming (31-{upcoming_days} days) "
                  f"| {counts['UPCOMING']} |\n"
              )

              summary.write(
                  f"| Expiring within {threshold} days "
                  f"| {counts['EXPIRING_SOON']} |\n"
              )

              summary.write(
                  f"| Expired "
                  f"| {counts['EXPIRED']} |\n\n"
              )

              sections = [
                  (
                      "Credentials requiring attention",
                      attention,
                      "No credentials require immediate attention."
                  ),
                  (
                      "Upcoming credentials",
                      upcoming,
                      "No credentials are in the upcoming window."
                  ),
                  (
                      "Full credential inventory",
                      credentials,
                      "No credentials were returned by Microsoft Graph."
                  ),
              ]

              for heading, items, empty in sections:

                  summary.write(
                      f"## {heading}\n\n"
                  )

                  if items:

                      summary.write(
                          "| Application | Application ID | "
                          "Type | Credential | Expiry | "
                          "Days | Status | Key ID |\n"
                      )

                      summary.write(
                          "|---|---|---|---|---|---:|---|---|\n"
                      )

                      for credential in items:

                          summary.write(
                              table_row(credential)
                              + "\n"
                          )

                  else:

                      summary.write(
                          empty + "\n"
                      )

                  summary.write("\n")

              summary.write(
                  "## Monitoring policy\n\n"
              )

              summary.write(
                  f"- Warning threshold: "
                  f"{threshold} days\n"
              )

              summary.write(
                  f"- Upcoming window: "
                  f"{upcoming_days} days\n"
              )

              summary.write(
                  "- Client secrets and certificates are monitored.\n"
              )

              summary.write(
                  "- Alert issues are created or updated "
                  "for expired and expiring credentials.\n"
              )

              summary.write(
                  "- Resolved credential issues are "
                  "closed automatically.\n"
              )

          with open(
              summary_file,
              "a"
          ) as github_summary:

              github_summary.write(
                  open("report.md").read()
              )

          PY

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: azure-secret-expiry-scan
          path: |
            scan-results.json
            report.md
          retention-days: 1


  manage-issues:
    name: Create or update credential issues

    needs: scan

    if: needs.scan.result == 'success'

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: azure-secret-expiry-scan


      - name: Create, update, and close credential issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THRESHOLD_DAYS: ${{ env.THRESHOLD_DAYS }}

        shell: bash

        run: |
          set -euo pipefail

          alerts="$(jq -c '.alerts[]' scan-results.json)"

          if [[ -n "${alerts}" ]]; then

            while IFS= read -r credential; do

              application="$(jq -r '.application' <<< "$credential")"

              app_id="$(jq -r '.appId' <<< "$credential")"

              type="$(jq -r '.type' <<< "$credential")"

              name="$(jq -r '.credentialName' <<< "$credential")"

              key_id="$(jq -r '.keyId' <<< "$credential")"

              expiry="$(jq -r '.expiry' <<< "$credential")"

              days="$(jq -r '.days' <<< "$credential")"

              status="$(jq -r '.status' <<< "$credential")"


              # Stable identity:
              # Application ID + Credential Key ID
              marker="<!-- azure-credential:${app_id}:${key_id} -->"

              title="Azure credential expiry: ${application} / ${name}"


              body="$(cat <<EOF
          ${marker}

          ## Azure Credential Expiry Alert

          | Property | Value |
          |---|---|
          | Application | \`${application}\` |
          | Application ID | \`${app_id}\` |
          | Credential type | ${type} |
          | Credential | \`${name}\` |
          | Key ID | \`${key_id}\` |
          | Expiry | **${expiry}** |
          | Days remaining | **${days} days** |
          | Status | **${status}** |
          | Warning threshold | ${THRESHOLD_DAYS} days |

          ### Recommended action

          Rotate the credential before it expires and update dependent workloads.

          This issue is maintained automatically by the Azure Secret Expiry Monitor.
          EOF
          )"


              # Retrieve existing open issues
              open_issues="$(
                gh issue list \
                  --repo "$REPOSITORY" \
                  --state open \
                  --limit 1000 \
                  --json number,body
              )"


              # Find issue containing our immutable credential marker
              existing_numbers="$(
                jq -r \
                  --arg marker "$marker" \
                  '.[] |
                   select(
                     .body != null
                     and (.body | contains($marker))
                   ) |
                   .number' \
                  <<< "$open_issues"
              )"


              existing="$(
                printf '%s\n' "$existing_numbers" |
                sed '/^$/d' |
                head -n 1
              )"


              if [[ -n "$existing" ]]; then

                gh issue edit \
                  "$existing" \
                  --repo "$REPOSITORY" \
                  --title "$title" \
                  --body "$body"

                echo \
                  "Updated issue #${existing}: ${application} / ${name}"

              else

                gh issue create \
                  --repo "$REPOSITORY" \
                  --title "$title" \
                  --body "$body"

                echo \
                  "Created issue: ${application} / ${name}"

              fi


              # Close duplicate issues
              while IFS= read -r duplicate; do

                [[ -z "$duplicate" ]] && continue

                [[ "$duplicate" == "$existing" ]] && continue

                gh issue close \
                  "$duplicate" \
                  --repo "$REPOSITORY" \
                  --comment \
                  "Duplicate of #${existing}. Closed automatically by Azure Secret Expiry Monitor."

                echo \
                  "Closed duplicate issue #${duplicate}."

              done <<< "$existing_numbers"


            done <<< "$alerts"

          else

            echo \
              "No expired or expiring credentials require an alert issue."

          fi


          # ------------------------------------------------------------
          # Close issues for credentials that are no longer alerting
          # ------------------------------------------------------------

          open_issues="$(
            gh issue list \
              --repo "$REPOSITORY" \
              --state open \
              --limit 1000 \
              --json number,body,title
          )"


          managed_issues="$(
            jq -c \
              '.[] |
               select(
                 .body != null
                 and (
                   .body |
                   contains("<!-- azure-credential:")
                 )
               )' \
              <<< "$open_issues"
          )"


          if [[ -n "${managed_issues}" ]]; then

            while IFS= read -r issue; do

              [[ -z "$issue" ]] && continue

              number="$(jq -r '.number' <<< "$issue")"

              body="$(jq -r '.body' <<< "$issue")"


              marker="$(
                grep \
                  -o \
                  '<!-- azure-credential:[^>]* -->' \
                  <<< "$body" |
                head -n 1 ||
                true
              )"


              [[ -z "$marker" ]] && continue


              active="$(
                jq -r \
                  --arg marker "$marker" \
                  '.alerts[] |
                   "<!-- azure-credential:"
                   + .appId
                   + ":"
                   + .keyId
                   + " -->"' \
                  scan-results.json |
                grep -Fx "$marker" ||
                true
              )"


              if [[ -z "$active" ]]; then

                gh issue close \
                  "$number" \
                  --repo "$REPOSITORY" \
                  --comment \
                  "Credential is no longer in the active expiry-alert set. Closed automatically by Azure Secret Expiry Monitor."

                echo \
                  "Closed resolved issue #${number}."

              fi

            done <<< "$managed_issues"

          fi


  publish-report:
    name: Publish monitoring summary

    needs:
      - scan
      - manage-issues

    if: always() && needs.scan.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Download scan report
        uses: actions/download-artifact@v4
        with:
          name: azure-secret-expiry-scan


      - name: Publish final run summary
        env:
          ISSUE_JOB_RESULT: ${{ needs.manage-issues.result }}

        shell: bash

        run: |
          set -euo pipefail

          cat report.md >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "## Run details"
            echo ""

            echo "| Item | Value |"
            echo "|---|---|"

            echo "| Workflow | \`${GITHUB_WORKFLOW}\` |"

            echo "| Branch | \`${GITHUB_REF_NAME}\` |"

            echo "| Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"

            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"

            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"

            echo "| Issue management | \`${ISSUE_JOB_RESULT}\` |"

            echo "| Completed | $(date -u '+%Y-%m-%d %H:%M UTC') |"

          } >> "$GITHUB_STEP_SUMMARY"
