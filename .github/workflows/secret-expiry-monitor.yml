name: Azure Secret Expiry Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: azure-secret-expiry-monitor
  cancel-in-progress: false

env:
  THRESHOLD_DAYS: ${{ vars.THRESHOLD_DAYS || 30 }}
  UPCOMING_DAYS: ${{ vars.UPCOMING_DAYS || 60 }}

jobs:
  monitor-credentials:
    name: Scan Entra application credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Scan all applications and credentials
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          export GRAPH_TOKEN="$(az account get-access-token \
            --resource-type ms-graph \
            --query accessToken \
            -o tsv)"

          : "${GRAPH_TOKEN:?Could not obtain Microsoft Graph token}"

          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["GRAPH_TOKEN"]
          threshold = int(os.environ.get("THRESHOLD_DAYS", "30"))
          upcoming_days = int(os.environ.get("UPCOMING_DAYS", "60"))
          summary_file = os.environ["GITHUB_STEP_SUMMARY"]
          now = datetime.now(timezone.utc)

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          # Microsoft Graph pagination: continue until @odata.nextLink is absent.
          applications = []
          url = (
              "https://graph.microsoft.com/v1.0/applications"
              "?$select=id,appId,displayName,passwordCredentials,keyCredentials"
              "&$top=999"
          )

          while url:
              response = get_json(url)
              applications.extend(response.get("value", []))
              url = response.get("@odata.nextLink")

          credentials = []

          for app in applications:
              application = app.get("displayName") or "(no display name)"
              app_id = app.get("appId") or ""

              for credential in app.get("passwordCredentials", []):
                  if not credential.get("endDateTime"):
                      continue

                  credentials.append({
                      "application": application,
                      "appId": app_id,
                      "type": "Client secret",
                      "credentialName": credential.get("displayName") or "(unnamed secret)",
                      "keyId": credential.get("keyId") or "",
                      "endDateTime": credential["endDateTime"],
                  })

              for credential in app.get("keyCredentials", []):
                  if not credential.get("endDateTime"):
                      continue

                  credentials.append({
                      "application": application,
                      "appId": app_id,
                      "type": "Certificate",
                      "credentialName": (
                          credential.get("displayName")
                          or credential.get("keyId")
                          or "(unnamed certificate)"
                      ),
                      "keyId": credential.get("keyId") or "",
                      "endDateTime": credential["endDateTime"],
                  })

          for credential in credentials:
              expiry = datetime.fromisoformat(
                  credential["endDateTime"].replace("Z", "+00:00")
              )

              remaining_seconds = (expiry - now).total_seconds()
              remaining_days = remaining_seconds / 86400

              if remaining_seconds <= 0:
                  status = "EXPIRED"
              elif remaining_days <= threshold:
                  status = "EXPIRING_SOON"
              elif remaining_days <= upcoming_days:
                  status = "UPCOMING"
              else:
                  status = "HEALTHY"

              credential["expiry"] = expiry.strftime("%Y-%m-%d %H:%M UTC")
              credential["days"] = remaining_days
              credential["status"] = status

          credentials.sort(key=lambda item: item["days"])

          counts = {
              "HEALTHY": sum(c["status"] == "HEALTHY" for c in credentials),
              "UPCOMING": sum(c["status"] == "UPCOMING" for c in credentials),
              "EXPIRING_SOON": sum(c["status"] == "EXPIRING_SOON" for c in credentials),
              "EXPIRED": sum(c["status"] == "EXPIRED" for c in credentials),
          }

          attention = [
              c for c in credentials
              if c["status"] in ("EXPIRING_SOON", "EXPIRED")
          ]

          upcoming = [
              c for c in credentials
              if c["status"] == "UPCOMING"
          ]

          # Save only actionable credentials for the issue-management step.
          with open("credentials.json", "w") as file:
              json.dump({"credentials": attention}, file)

          def table_row(c):
              return (
                  f"| {c['application']} | `{c['appId']}` | {c['type']} | "
                  f"{c['credentialName']} | {c['expiry']} | {c['days']:.1f} | "
                  f"**{c['status']}** | `{c['keyId']}` |"
              )

          with open(summary_file, "a") as summary:
              summary.write("# Azure Secret Expiry Report\n\n")
              summary.write(
                  f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}\n\n"
              )

              summary.write("## Overview\n\n")
              summary.write("| Metric | Count |\n")
              summary.write("|---|---:|\n")
              summary.write(f"| Applications scanned | {len(applications)} |\n")
              summary.write(f"| Credentials scanned | {len(credentials)} |\n")
              summary.write(f"| Healthy | {counts['HEALTHY']} |\n")
              summary.write(
                  f"| Upcoming (31-{upcoming_days} days) | {counts['UPCOMING']} |\n"
              )
              summary.write(
                  f"| Expiring within {threshold} days | {counts['EXPIRING_SOON']} |\n"
              )
              summary.write(f"| Expired | {counts['EXPIRED']} |\n\n")

              summary.write("## Credentials requiring attention\n\n")
              if attention:
                  summary.write(
                      "| Application | Application ID | Type | Credential | "
                      "Expiry | Days | Status | Key ID |\n"
                  )
                  summary.write(
                      "|---|---|---|---|---|---:|---|---|\n"
                  )
                  for credential in attention:
                      summary.write(table_row(credential) + "\n")
              else:
                  summary.write("No credentials require immediate attention.\n")

              summary.write("\n## Upcoming credentials\n\n")
              if upcoming:
                  summary.write(
                      "| Application | Application ID | Type | Credential | "
                      "Expiry | Days | Status | Key ID |\n"
                  )
                  summary.write(
                      "|---|---|---|---|---|---:|---|---|\n"
                  )
                  for credential in upcoming:
                      summary.write(table_row(credential) + "\n")
              else:
                  summary.write("No credentials are in the upcoming window.\n")

              summary.write("\n## Full credential inventory\n\n")
              if credentials:
                  summary.write(
                      "| Application | Application ID | Type | Credential | "
                      "Expiry | Days | Status | Key ID |\n"
                  )
                  summary.write(
                      "|---|---|---|---|---|---:|---|---|\n"
                  )
                  for credential in credentials:
                      summary.write(table_row(credential) + "\n")
              else:
                  summary.write("No credentials were returned by Microsoft Graph.\n")

              summary.write("\n## Monitoring policy\n\n")
              summary.write(f"- Warning threshold: {threshold} days\n")
              summary.write(f"- Upcoming window: {upcoming_days} days\n")
              summary.write("- Client secrets and certificates are monitored.\n")
              summary.write(
                  "- Alert issues are created only for expired or expiring credentials.\n"
              )
          PY

      - name: Create or update alert issues
        if: always() && steps.scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THRESHOLD_DAYS: ${{ env.THRESHOLD_DAYS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f credentials.json ]]; then
            echo "No credential data file was produced."
            exit 1
          fi

          alert_count="$(jq '.credentials | length' credentials.json)"
          echo "Processing ${alert_count} alerting credentials."

          if [[ "${alert_count}" -eq 0 ]]; then
            echo "No issues need to be created or updated."
            exit 0
          fi

          while IFS= read -r credential; do
            application="$(jq -r '.application' <<< "$credential")"
            app_id="$(jq -r '.appId' <<< "$credential")"
            type="$(jq -r '.type' <<< "$credential")"
            name="$(jq -r '.credentialName' <<< "$credential")"
            key_id="$(jq -r '.keyId' <<< "$credential")"
            expiry="$(jq -r '.expiry' <<< "$credential")"
            days="$(jq -r '.days' <<< "$credential")"
            status="$(jq -r '.status' <<< "$credential")"

            title="Azure credential expiry: ${application} / ${name}"

            body="$(cat <<EOF
          ## Azure Credential Expiry Alert

          | Property | Value |
          |---|---|
          | Application | \`${application}\` |
          | Application ID | \`${app_id}\` |
          | Credential type | ${type} |
          | Credential | \`${name}\` |
          | Key ID | \`${key_id}\` |
          | Expiry | **${expiry}** |
          | Days remaining | **${days}** |
          | Status | **${status}** |
          | Warning threshold | ${THRESHOLD_DAYS} days |

          ### Recommended action

          Rotate the credential before it expires and update dependent workloads.

          This issue is maintained automatically by the Azure Secret Expiry Monitor.
          EOF
          )"

            # Key the search on both application ID and credential name.
            existing="$(
              gh issue list \
                --repo "$REPOSITORY" \
                --state open \
                --search "in:title ${app_id} ${name}" \
                --json number,title \
                --jq '.[0].number // empty'
            )"

            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" \
                --repo "$REPOSITORY" \
                --title "$title" \
                --body "$body"
              echo "Updated issue #${existing}: ${application} / ${name}"
            else
              gh issue create \
                --repo "$REPOSITORY" \
                --title "$title" \
                --body "$body"
              echo "Created issue: ${application} / ${name}"
            fi
          done < <(jq -c '.credentials[]' credentials.json)

      - name: Add run details to summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## Run details"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | \`${GITHUB_WORKFLOW}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Completed | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
