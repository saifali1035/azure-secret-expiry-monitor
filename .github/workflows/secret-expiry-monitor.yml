name: Azure Secret Expiry Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: azure-secret-expiry-monitor
  cancel-in-progress: false

env:
  THRESHOLD_DAYS: ${{ vars.THRESHOLD_DAYS || 30 }}
  UPCOMING_DAYS: ${{ vars.UPCOMING_DAYS || 60 }}

jobs:
  scan:
    name: Scan Entra application credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      scan_results_b64: ${{ steps.export-results.outputs.scan_results_b64 }}
      report_b64: ${{ steps.export-results.outputs.report_b64 }}

    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Scan all applications and credentials
        shell: bash
        run: |
          set -euo pipefail

          export GRAPH_TOKEN="$(az account get-access-token \
            --resource-type ms-graph \
            --query accessToken \
            -o tsv)"
          : "${GRAPH_TOKEN:?Could not obtain Microsoft Graph token}"

          python3 <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          token = os.environ["GRAPH_TOKEN"]
          threshold = int(os.environ.get("THRESHOLD_DAYS", "30"))
          upcoming_days = int(os.environ.get("UPCOMING_DAYS", "60"))
          now = datetime.now(timezone.utc)
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          applications = []
          url = ("https://graph.microsoft.com/v1.0/applications"
                 "?$select=id,appId,displayName,passwordCredentials,keyCredentials"
                 "&$top=999")
          while url:
              response = get_json(url)
              applications.extend(response.get("value", []))
              url = response.get("@odata.nextLink")

          credentials = []
          for app in applications:
              application = app.get("displayName") or "(no display name)"
              app_id = app.get("appId") or ""

              for c in app.get("passwordCredentials", []):
                  if c.get("endDateTime"):
                      credentials.append({
                          "application": application, "appId": app_id,
                          "type": "Client secret",
                          "credentialName": c.get("displayName") or "(unnamed secret)",
                          "keyId": c.get("keyId") or "",
                          "endDateTime": c["endDateTime"]})

              for c in app.get("keyCredentials", []):
                  if c.get("endDateTime"):
                      credentials.append({
                          "application": application, "appId": app_id,
                          "type": "Certificate",
                          "credentialName": c.get("displayName") or c.get("keyId") or "(unnamed certificate)",
                          "keyId": c.get("keyId") or "",
                          "endDateTime": c["endDateTime"]})

          unique = {}
          for c in credentials:
              unique[(c["appId"], c["keyId"], c["type"])] = c
          credentials = list(unique.values())

          for c in credentials:
              expiry = datetime.fromisoformat(c["endDateTime"].replace("Z", "+00:00"))
              remaining_seconds = (expiry - now).total_seconds()
              remaining_days = remaining_seconds / 86400
              if remaining_seconds <= 0:
                  status = "EXPIRED"
              elif remaining_days <= threshold:
                  status = "EXPIRING_SOON"
              elif remaining_days <= upcoming_days:
                  status = "UPCOMING"
              else:
                  status = "HEALTHY"
              c["expiry"] = expiry.strftime("%Y-%m-%d %H:%M UTC")
              c["days"] = max(0, int(remaining_days))
              c["status"] = status

          credentials.sort(key=lambda c: c["days"])
          counts = {s: sum(c["status"] == s for c in credentials)
                    for s in ("HEALTHY", "UPCOMING", "EXPIRING_SOON", "EXPIRED")}
          attention = [c for c in credentials if c["status"] in ("EXPIRING_SOON", "EXPIRED")]
          upcoming = [c for c in credentials if c["status"] == "UPCOMING"]

          with open("scan-results.json", "w") as f:
              json.dump({"credentials": credentials, "alerts": attention}, f, indent=2)

          def row(c):
              return (f"| {c['application']} | `{c['appId']}` | {c['type']} | "
                      f"{c['credentialName']} | {c['expiry']} | {c['days']} days | "
                      f"**{c['status']}** | `{c['keyId']}` |")

          with open("report.md", "w") as report:
              report.write("# Azure Secret Expiry Report\n\n")
              report.write(f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}\n\n")
              report.write("## Overview\n\n| Metric | Count |\n|---|---:|\n")
              report.write(f"| Applications scanned | {len(applications)} |\n")
              report.write(f"| Credentials scanned | {len(credentials)} |\n")
              report.write(f"| Healthy | {counts['HEALTHY']} |\n")
              report.write(f"| Upcoming (31-{upcoming_days} days) | {counts['UPCOMING']} |\n")
              report.write(f"| Expiring within {threshold} days | {counts['EXPIRING_SOON']} |\n")
              report.write(f"| Expired | {counts['EXPIRED']} |\n\n")

              sections = [
                  ("Credentials requiring attention", attention, "No credentials require immediate attention."),
                  ("Upcoming credentials", upcoming, "No credentials are in the upcoming window."),
                  ("Full credential inventory", credentials, "No credentials were returned by Microsoft Graph.")]
              for heading, items, empty in sections:
                  report.write(f"## {heading}\n\n")
                  if items:
                      report.write("| Application | Application ID | Type | Credential | Expiry | Days | Status | Key ID |\n")
                      report.write("|---|---|---|---|---|---:|---|---|\n")
                      for c in items:
                          report.write(row(c) + "\n")
                  else:
                      report.write(empty + "\n")
                  report.write("\n")

              report.write("## Monitoring policy\n\n")
              report.write(f"- Warning threshold: {threshold} days\n")
              report.write(f"- Upcoming window: {upcoming_days} days\n")
              report.write("- Client secrets and certificates are monitored.\n")
              report.write("- Alert issues are created or updated for expired and expiring credentials.\n")
              report.write("- Resolved credential issues are closed automatically.\n")
          PY

      - name: Export scan results
        id: export-results
        shell: bash
        run: |
          set -euo pipefail
          echo "scan_results_b64=$(base64 -w0 scan-results.json)" >> "$GITHUB_OUTPUT"
          echo "report_b64=$(base64 -w0 report.md)" >> "$GITHUB_OUTPUT"

  manage-issues:
    name: Create or update credential issues
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Restore scan results
        shell: bash
        env:
          SCAN_RESULTS_B64: ${{ needs.scan.outputs.scan_results_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SCAN_RESULTS_B64" | base64 -d > scan-results.json

      - name: Create, update, deduplicate, and close credential issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THRESHOLD_DAYS: ${{ env.THRESHOLD_DAYS }}
        shell: bash
        run: |
          set -euo pipefail

          open_issues="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number,title,body)"

          while IFS= read -r credential; do
            [[ -z "$credential" ]] && continue

            application="$(jq -r '.application' <<< "$credential")"
            app_id="$(jq -r '.appId' <<< "$credential")"
            type="$(jq -r '.type' <<< "$credential")"
            name="$(jq -r '.credentialName' <<< "$credential")"
            key_id="$(jq -r '.keyId' <<< "$credential")"
            expiry="$(jq -r '.expiry' <<< "$credential")"
            days="$(jq -r '.days' <<< "$credential")"
            status="$(jq -r '.status' <<< "$credential")"

            marker="<!-- azure-credential:${app_id}:${key_id} -->"
            issue_key="${app_id}:${key_id}"
            title="Azure credential expiry: ${application} / ${name} [${issue_key}]"

            body="$(cat <<EOF
          ${marker}

          ## Azure Credential Expiry Alert

          | Property | Value |
          |---|---|
          | Application | \`${application}\` |
          | Application ID | \`${app_id}\` |
          | Credential type | ${type} |
          | Credential | \`${name}\` |
          | Key ID | \`${key_id}\` |
          | Expiry | **${expiry}** |
          | Days remaining | **${days} days** |
          | Status | **${status}** |
          | Warning threshold | ${THRESHOLD_DAYS} days |

          ### Recommended action

          Rotate the credential before it expires and update dependent workloads.

          This issue is maintained automatically by the Azure Secret Expiry Monitor.
          EOF
          )"

            matching_numbers="$(jq -r --arg marker "$marker" --arg key "$issue_key" '
              .[]
              | select(((.body // "") | contains($marker)) or ((.title // "") | contains("[" + $key + "]")))
              | .number
            ' <<< "$open_issues")"

            existing="$(printf '%s\n' "$matching_numbers" | sed '/^$/d' | head -n 1)"

            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "$REPOSITORY" --title "$title" --body "$body"
              echo "Updated issue #${existing}: ${application} / ${name}"
            else
              created_url="$(gh issue create --repo "$REPOSITORY" --title "$title" --body "$body")"
              existing="${created_url##*/}"
              echo "Created issue #${existing}: ${application} / ${name}"
            fi

            while IFS= read -r duplicate; do
              [[ -z "$duplicate" || "$duplicate" == "$existing" ]] && continue
              gh issue close "$duplicate" --repo "$REPOSITORY" \
                --comment "Duplicate of #${existing}. Closed automatically by Azure Secret Expiry Monitor."
              echo "Closed duplicate issue #${duplicate}."
            done <<< "$matching_numbers"

          done < <(jq -c '.alerts[]' scan-results.json)

          open_issues="$(gh issue list --repo "$REPOSITORY" --state open --limit 1000 --json number,title,body)"

          while IFS= read -r issue; do
            [[ -z "$issue" ]] && continue
            number="$(jq -r '.number' <<< "$issue")"
            body="$(jq -r '.body // ""' <<< "$issue")"
            title="$(jq -r '.title // ""' <<< "$issue")"

            marker="$(grep -o '<!-- azure-credential:[^>]* -->' <<< "$body" | head -n 1 || true)"
            if [[ -z "$marker" ]]; then
              key="$(grep -o '\[[0-9a-fA-F-]\{36\}:[0-9a-fA-F-]\{36\}\]' <<< "$title" | head -n 1 || true)"
              key="${key#[}"
              key="${key%]}"
              [[ -n "$key" ]] && marker="<!-- azure-credential:${key} -->"
            fi
            [[ -z "$marker" ]] && continue

            active="$(jq -r '.alerts[] | "<!-- azure-credential:" + .appId + ":" + .keyId + " -->"' scan-results.json | grep -Fx "$marker" || true)"

            if [[ -z "$active" ]]; then
              gh issue close "$number" --repo "$REPOSITORY" \
                --comment "Credential is no longer in the active expiry-alert set. Closed automatically by Azure Secret Expiry Monitor."
              echo "Closed resolved issue #${number}."
            fi
          done < <(jq -c '.[]' <<< "$open_issues")

  publish-report:
    name: Publish monitoring summary
    needs:
      - scan
      - manage-issues
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Restore monitoring report
        shell: bash
        env:
          REPORT_B64: ${{ needs.scan.outputs.report_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$REPORT_B64" | base64 -d > report.md

      - name: Publish final run summary
        env:
          ISSUE_JOB_RESULT: ${{ needs.manage-issues.result }}
        shell: bash
        run: |
          set -euo pipefail

          cat report.md >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "## Run details"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | \`${GITHUB_WORKFLOW}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Issue management | \`${ISSUE_JOB_RESULT}\` |"
            echo "| Completed | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
