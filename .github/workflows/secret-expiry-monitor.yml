name: 🔐 Azure Secret Expiry Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: azure-secret-expiry-monitor
  cancel-in-progress: false

env:
  TARGET_APP_ID: ${{ vars.TARGET_APP_ID }}
  TARGET_SECRET_NAME: New-Secret-DEV
  THRESHOLD_DAYS: ${{ vars.THRESHOLD_DAYS || 30 }}

jobs:
  monitor-secret:
    name: 🔍 Inspect Azure secret
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔐 Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔎 Query Microsoft Graph
        id: inspect
        shell: bash
        run: |
          set -euo pipefail

          : "${TARGET_APP_ID:?TARGET_APP_ID repository variable is missing}"

          echo "### 🔐 Azure Secret Expiry Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target application | \`${TARGET_APP_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target secret | \`${TARGET_SECRET_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Warning threshold | ${THRESHOLD_DAYS} days |" >> "$GITHUB_STEP_SUMMARY"

          GRAPH_TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          : "${GRAPH_TOKEN:?Could not obtain Microsoft Graph token}"

          RESPONSE="$(curl --silent --show-error --fail-with-body --get \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-urlencode "\$filter=appId eq '${TARGET_APP_ID}'" \
            --data-urlencode "\$select=id,appId,displayName,passwordCredentials" \
            "https://graph.microsoft.com/v1.0/applications")"

          APP_COUNT="$(echo "$RESPONSE" | jq '.value | length')"
          if [[ "$APP_COUNT" -eq 0 ]]; then
            echo "❌ No application found for TARGET_APP_ID."
            echo "| Application lookup | ❌ Not found |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          APP_DISPLAY_NAME="$(echo "$RESPONSE" | jq -r '.value[0].displayName')"
          SECRET="$(echo "$RESPONSE" | jq -c --arg name "$TARGET_SECRET_NAME" '.value[0].passwordCredentials[] | select(.displayName == $name)' | head -n 1)"

          if [[ -z "$SECRET" ]]; then
            echo "❌ Secret ${TARGET_SECRET_NAME} was not found."
            echo "| Application | \`${APP_DISPLAY_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Secret lookup | ❌ Not found |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          SECRET_NAME="$(echo "$SECRET" | jq -r '.displayName')"
          END_DATE="$(echo "$SECRET" | jq -r '.endDateTime')"
          KEY_ID="$(echo "$SECRET" | jq -r '.keyId')"
          EXPIRY_EPOCH="$(date -d "$END_DATE" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          REMAINING_SECONDS=$((EXPIRY_EPOCH - NOW_EPOCH))
          REMAINING_DAYS=$((REMAINING_SECONDS / 86400))

          if (( REMAINING_SECONDS <= 0 )); then
            STATUS="EXPIRED"
            ICON="🔴"
          elif (( REMAINING_SECONDS <= THRESHOLD_DAYS * 86400 )); then
            STATUS="EXPIRING_SOON"
            ICON="🟠"
          elif (( REMAINING_SECONDS <= 2 * THRESHOLD_DAYS * 86400 )); then
            STATUS="UPCOMING"
            ICON="🟡"
          else
            STATUS="HEALTHY"
            ICON="🟢"
          fi

          EXPIRY_DISPLAY="$(date -u -d "$END_DATE" '+%Y-%m-%d %H:%M UTC')"
          CHECKED_DISPLAY="$(date -u '+%Y-%m-%d %H:%M UTC')"

          echo "APP_DISPLAY_NAME=$APP_DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "SECRET_NAME=$SECRET_NAME" >> "$GITHUB_OUTPUT"
          echo "END_DATE=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "EXPIRY_DISPLAY=$EXPIRY_DISPLAY" >> "$GITHUB_OUTPUT"
          echo "REMAINING_DAYS=$REMAINING_DAYS" >> "$GITHUB_OUTPUT"
          echo "STATUS=$STATUS" >> "$GITHUB_OUTPUT"
          echo "ICON=$ICON" >> "$GITHUB_OUTPUT"
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_OUTPUT"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | **${ICON} ${STATUS}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application | \`${APP_DISPLAY_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | \`${SECRET_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Expires | **${EXPIRY_DISPLAY}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Days remaining | **${REMAINING_DAYS}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key ID | \`${KEY_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Checked | ${CHECKED_DISPLAY} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STATUS" == "HEALTHY" ]]; then
            echo "### ✅ No action required" >> "$GITHUB_STEP_SUMMARY"
            echo "The secret is outside the configured warning window." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$STATUS" == "UPCOMING" ]]; then
            echo "### 👀 Upcoming expiry" >> "$GITHUB_STEP_SUMMARY"
            echo "The secret is more than ${THRESHOLD_DAYS} days away, but within the next $((THRESHOLD_DAYS * 2)) days." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$STATUS" == "EXPIRING_SOON" ]]; then
            echo "### ⚠️ Action recommended" >> "$GITHUB_STEP_SUMMARY"
            echo "Rotate the secret before it expires." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🚨 Immediate action required" >> "$GITHUB_STEP_SUMMARY"
            echo "The secret has expired. Rotate it immediately." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📝 Manage expiry issue
        if: always() && steps.inspect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STATUS: ${{ steps.inspect.outputs.STATUS }}
          SECRET_NAME: ${{ steps.inspect.outputs.SECRET_NAME }}
          APP_NAME: ${{ steps.inspect.outputs.APP_DISPLAY_NAME }}
          END_DATE: ${{ steps.inspect.outputs.EXPIRY_DISPLAY }}
          REMAINING_DAYS: ${{ steps.inspect.outputs.REMAINING_DAYS }}
          THRESHOLD_DAYS: ${{ env.THRESHOLD_DAYS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$STATUS" == "HEALTHY" || "$STATUS" == "UPCOMING" ]]; then
            echo "No alert issue required for status: $STATUS"
            echo "### 📝 Issue management" >> "$GITHUB_STEP_SUMMARY"
            echo "No new alert issue created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$STATUS" == "EXPIRED" ]]; then
            TITLE="🚨 Azure secret expired: ${SECRET_NAME}"
          else
            TITLE="⚠️ Azure secret expiring soon: ${SECRET_NAME}"
          fi

          BODY="$(cat <<EOF
          ## Azure Secret Expiry Alert

          > **${STATUS}** — automated monitoring detected that this Azure application secret requires attention.

          | Property | Value |
          |---|---|
          | Application | \`${APP_NAME}\` |
          | Secret | \`${SECRET_NAME}\` |
          | Expires | **${END_DATE}** |
          | Days remaining | **${REMAINING_DAYS}** |
          | Warning threshold | ${THRESHOLD_DAYS} days |
          | Status | **${STATUS}** |

          ### Recommended action

          Rotate the Azure application secret and update all dependent applications/workloads before service impact occurs.

          ---
          _Generated automatically by the Azure Secret Expiry Monitor._

          [View workflow run](${RUN_URL})
          EOF
          )"

          EXISTING_ISSUE="$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "in:title ${SECRET_NAME}" \
            --json number,title \
            --jq '.[0].number // empty')"

          if [[ -n "$EXISTING_ISSUE" ]]; then
            gh issue edit "$EXISTING_ISSUE" --repo "$REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "Updated issue #${EXISTING_ISSUE}"
            echo "### 📝 Issue management" >> "$GITHUB_STEP_SUMMARY"
            echo "Updated existing issue **#${EXISTING_ISSUE}**." >> "$GITHUB_STEP_SUMMARY"
          else
            ISSUE_URL="$(gh issue create --repo "$REPOSITORY" --title "$TITLE" --body "$BODY")"
            echo "Created issue: $ISSUE_URL"
            echo "### 📝 Issue management" >> "$GITHUB_STEP_SUMMARY"
            echo "Created alert issue: ${ISSUE_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📊 Final workflow summary
        if: always()
        shell: bash
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### ⚙️ Run details" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow | \`${GITHUB_WORKFLOW}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Completed | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
