name: Azure Secret Expiry Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: azure-secret-expiry-monitor
  cancel-in-progress: false

env:
  THRESHOLD_DAYS: ${{ vars.THRESHOLD_DAYS || 30 }}
  UPCOMING_DAYS: ${{ vars.UPCOMING_DAYS || 60 }}

jobs:
  monitor-credentials:
    name: Scan Entra application credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Scan all applications and credentials
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          GRAPH_TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          : "${GRAPH_TOKEN:?Could not obtain Microsoft Graph token}"

          python3 <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["GRAPH_TOKEN"] if "GRAPH_TOKEN" in os.environ else subprocess.check_output(
              ["az", "account", "get-access-token", "--resource-type", "ms-graph", "--query", "accessToken", "-o", "tsv"], text=True
          ).strip()
          threshold = int(os.environ.get("THRESHOLD_DAYS", "30"))
          upcoming = int(os.environ.get("UPCOMING_DAYS", "60"))
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          now = datetime.now(timezone.utc)

          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          applications = []
          url = "https://graph.microsoft.com/v1.0/applications?$select=id,appId,displayName,passwordCredentials,keyCredentials&$top=999"
          while url:
              data = get_json(url)
              applications.extend(data.get("value", []))
              url = data.get("@odata.nextLink")

          credentials = []
          for app in applications:
              for c in app.get("passwordCredentials", []):
                  if c.get("endDateTime"):
                      credentials.append({
                          "type": "Client secret",
                          "application": app.get("displayName") or "(no display name)",
                          "appId": app.get("appId"),
                          "credentialName": c.get("displayName") or "(unnamed secret)",
                          "keyId": c.get("keyId"),
                          "endDateTime": c.get("endDateTime"),
                      })
              for c in app.get("keyCredentials", []):
                  if c.get("endDateTime"):
                      credentials.append({
                          "type": "Certificate",
                          "application": app.get("displayName") or "(no display name)",
                          "appId": app.get("appId"),
                          "credentialName": c.get("displayName") or c.get("keyId") or "(unnamed certificate)",
                          "keyId": c.get("keyId"),
                          "endDateTime": c.get("endDateTime"),
                      })

          for c in credentials:
              expiry = datetime.fromisoformat(c["endDateTime"].replace("Z", "+00:00"))
              seconds = (expiry - now).total_seconds()
              days = seconds / 86400
              if seconds <= 0:
                  c["status"] = "EXPIRED"
              elif days <= threshold:
                  c["status"] = "EXPIRING_SOON"
              elif days <= upcoming:
                  c["status"] = "UPCOMING"
              else:
                  c["status"] = "HEALTHY"
              c["days"] = days
              c["expiry"] = expiry.strftime("%Y-%m-%d %H:%M UTC")

          counts = {s: sum(c["status"] == s for c in credentials) for s in ["HEALTHY", "UPCOMING", "EXPIRING_SOON", "EXPIRED"]}
          expiring = sorted([c for c in credentials if c["status"] in ("EXPIRING_SOON", "EXPIRED")], key=lambda x: x["days"])
          upcoming_list = sorted([c for c in credentials if c["status"] == "UPCOMING"], key=lambda x: x["days"])

          print(f"Applications scanned: {len(applications)}")
          print(f"Credentials scanned: {len(credentials)}")
          print(f"Healthy: {counts['HEALTHY']}")
          print(f"Upcoming: {counts['UPCOMING']}")
          print(f"Expiring soon: {counts['EXPIRING_SOON']}")
          print(f"Expired: {counts['EXPIRED']}")

          with open(summary, "a") as f:
              f.write("# Azure Secret Expiry Report\n\n")
              f.write(f"Checked: {now.strftime('%Y-%m-%d %H:%M UTC')}\n\n")
              f.write("## Overview\n\n")
              f.write("| Metric | Count |\n|---|---:|\n")
              f.write(f"| Applications scanned | {len(applications)} |\n")
              f.write(f"| Credentials scanned | {len(credentials)} |\n")
              f.write(f"| Healthy | {counts['HEALTHY']} |\n")
              f.write(f"| Upcoming (31-{upcoming} days) | {counts['UPCOMING']} |\n")
              f.write(f"| Expiring within {threshold} days | {counts['EXPIRING_SOON']} |\n")
              f.write(f"| Expired | {counts['EXPIRED']} |\n\n")

              f.write("## Credentials requiring attention\n\n")
              if expiring:
                  f.write("| Application | Type | Credential | Expiry | Days | Status |\n|---|---|---|---|---:|---|\n")
                  for c in expiring:
                      f.write(f"| {c['application']} | {c['type']} | {c['credentialName']} | {c['expiry']} | {c['days']:.1f} | **{c['status']}** |\n")
              else:
                  f.write("No credentials require immediate attention.\n")
              f.write("\n## Upcoming credentials\n\n")
              if upcoming_list:
                  f.write("| Application | Type | Credential | Expiry | Days |\n|---|---|---|---|---:|\n")
                  for c in upcoming_list[:20]:
                      f.write(f"| {c['application']} | {c['type']} | {c['credentialName']} | {c['expiry']} | {c['days']:.1f} |\n")
                  if len(upcoming_list) > 20:
                      f.write(f"\nShowing first 20 of {len(upcoming_list)} upcoming credentials.\n")
              else:
                  f.write("No credentials are in the upcoming window.\n")

              f.write("\n## Monitoring policy\n\n")
              f.write(f"- Warning threshold: {threshold} days\n")
              f.write(f"- Upcoming window: {upcoming} days\n")
              f.write("- Both client secrets and certificates are monitored.\n")
              f.write("- Alert issues are created only for expired or expiring credentials.\n")

          with open("credentials.json", "w") as f:
              json.dump({"credentials": expiring}, f)
          PY
        env:
          GRAPH_TOKEN: ${{ steps.login.outputs.access_token }}

      - name: Create or update alert issues
        if: always() && steps.scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THRESHOLD_DAYS: ${{ env.THRESHOLD_DAYS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f credentials.json ]]; then
            echo "No credential data file was produced."
            exit 1
          fi

          count="$(jq '.credentials | length' credentials.json)"
          echo "Processing ${count} alerting credentials."

          jq -c '.credentials[]' credentials.json | while IFS= read -r credential; do
            app="$(jq -r '.application' <<< "$credential")"
            app_id="$(jq -r '.appId' <<< "$credential")"
            type="$(jq -r '.type' <<< "$credential")"
            name="$(jq -r '.credentialName' <<< "$credential")"
            key_id="$(jq -r '.keyId' <<< "$credential")"
            expiry="$(jq -r '.expiry' <<< "$credential")"
            days="$(jq -r '.days' <<< "$credential")"
            status="$(jq -r '.status' <<< "$credential")"

            title="Azure credential expiry: ${app} / ${name}"
            body="$(cat <<EOF
          ## Azure Credential Expiry Alert

          | Property | Value |
          |---|---|
          | Application | \`${app}\` |
          | Application ID | \`${app_id}\` |
          | Credential type | ${type} |
          | Credential | \`${name}\` |
          | Key ID | \`${key_id}\` |
          | Expiry | **${expiry}** |
          | Days remaining | **${days}** |
          | Status | **${status}** |
          | Warning threshold | ${THRESHOLD_DAYS} days |

          ### Recommended action

          Rotate the credential before it expires and update dependent workloads.

          This issue is maintained automatically by the Azure Secret Expiry Monitor.
          EOF
          )"

            existing="$(gh issue list --repo "$REPOSITORY" --state open --search "in:title ${app} / ${name}" --json number,title --jq '.[0].number // empty')"
            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "$REPOSITORY" --title "$title" --body "$body"
              echo "Updated issue #${existing} for ${app} / ${name}"
            else
              gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
              echo "Created issue for ${app} / ${name}"
            fi
          done

      - name: Add run details to summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## Run details"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Workflow | \`${GITHUB_WORKFLOW}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Completed | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
