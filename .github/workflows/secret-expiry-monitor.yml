name: Monitor Azure Secret Expiry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  monitor-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check secret expiry and create issue
        env:
          TARGET_APP_ID: ${{ vars.TARGET_APP_ID }}
          THRESHOLD_DAYS: ${{ vars.THRESHOLD_DAYS }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TARGET_APP_ID:?TARGET_APP_ID repository variable is missing}"
          THRESHOLD_DAYS="${THRESHOLD_DAYS:-30}"

          GRAPH_TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          : "${GRAPH_TOKEN:?Could not obtain Microsoft Graph token}"

          RESPONSE="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://graph.microsoft.com/v1.0/applications/appId/${TARGET_APP_ID}")"

          SECRET="$(echo "$RESPONSE" | jq -c '.passwordCredentials[] | select(.displayName == "New-Secret-DEV")' | head -n 1)"

          if [[ -z "$SECRET" ]]; then
            echo "ERROR: New-Secret-DEV was not found."
            exit 1
          fi

          SECRET_NAME="$(echo "$SECRET" | jq -r '.displayName')"
          END_DATE="$(echo "$SECRET" | jq -r '.endDateTime')"
          EXPIRY_EPOCH="$(date -d "$END_DATE" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          REMAINING_SECONDS=$((EXPIRY_EPOCH - NOW_EPOCH))
          REMAINING_DAYS=$((REMAINING_SECONDS / 86400))

          echo "Secret: ${SECRET_NAME}"
          echo "Expiry: ${END_DATE}"
          echo "Days remaining: ${REMAINING_DAYS}"

          if (( REMAINING_SECONDS > THRESHOLD_DAYS * 86400 )); then
            echo "Secret is outside the ${THRESHOLD_DAYS}-day warning window."
            exit 0
          fi

          if (( REMAINING_SECONDS <= 0 )); then
            TITLE="Azure secret expired: ${SECRET_NAME}"
            STATUS="EXPIRED"
          else
            TITLE="Azure secret expiring soon: ${SECRET_NAME}"
            STATUS="EXPIRING_SOON"
          fi

          BODY="$(cat <<EOF
          ## Azure Secret Expiry Alert

          | Property | Value |
          |---|---|
          | Application ID | \`${TARGET_APP_ID}\` |
          | Secret | \`${SECRET_NAME}\` |
          | Expiry | \`${END_DATE}\` |
          | Days remaining | **${REMAINING_DAYS}** |
          | Warning threshold | ${THRESHOLD_DAYS} days |
          | Status | **${STATUS}** |

          This issue was automatically created by GitHub Actions.

          Please rotate the Azure application secret.

          [View workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF
          )"

          EXISTING_ISSUE="$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "in:title ${SECRET_NAME}" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$EXISTING_ISSUE" ]]; then
            echo "Updating existing issue #${EXISTING_ISSUE}"
            gh issue edit "$EXISTING_ISSUE" --repo "$REPOSITORY" --title "$TITLE" --body "$BODY"
          else
            echo "Creating GitHub issue"
            gh issue create --repo "$REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
